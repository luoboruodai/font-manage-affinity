<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Font Manage</title><link rel="stylesheet" href="/style.css"></head>
<body><main id="app">
 <header><h1>Font Manage</h1></header>
 <nav aria-label="字体范围"><div class="tabs"><button data-scope="all" aria-pressed="true">全部</button><button data-scope="favorites">收藏</button><button data-scope="recent">最近</button><button id="groups-button" data-scope="group">分组</button></div><div class="nav-actions"><button id="settings" class="icon" aria-label="设置" title="设置"></button><button id="new-group" class="icon" aria-label="创建分组" title="创建分组"></button></div></nav>
 <section id="group-bar" hidden><select id="group-select" aria-label="当前分组"></select><button id="rename-group" class="icon" aria-label="重命名分组"></button><button id="delete-group" class="icon" aria-label="删除分组"></button></section>
 <div id="group-modal" class="modal-scrim" hidden><form id="group-form" class="modal-card" role="dialog" aria-label="分组编辑"><h2 id="group-form-title">创建分组</h2><button type="button" id="cancel-group" class="icon modal-close" aria-label="取消分组编辑"></button><input id="group-name" maxlength="64" placeholder="分组名称" aria-label="分组名称" required><button type="submit" class="primary">创建</button></form></div>
 <section class="tools"><div class="search-wrap"><span id="search-icon"></span><input id="search" type="search" aria-label="搜索字体" placeholder="搜索字体、字重…" autocomplete="off"></div><span class="select-wrap"><span id="kind-icon"></span><select id="kind" aria-label="字体分类筛选" title="字体分类筛选：决定列表显示哪些字体（衬线 / 无衬线 / 等宽）"><option value="all">全部类型</option><option value="serif">衬线</option><option value="sans">无衬线</option><option value="mono">等宽</option></select></span><select id="sort" aria-label="字体排序" title="字体排序"><option value="name">名称 A–Z</option><option value="desc">名称 Z–A</option><option value="recent">最近使用</option></select></section>
 <section class="preview-tools"><div id="preview-box"><textarea id="preview-text" aria-label="字体预览文字" rows="1" maxlength="500" spellcheck="false"></textarea></div><select id="language" aria-label="预览文本类型" title="预览文本类型：决定样例文字；开启“按文字系统覆盖筛选”时也决定列表文字系统"></select><button id="reset-preview" class="icon" aria-label="恢复当前类型默认样例" title="恢复当前类型默认样例（不会清除搜索与筛选）"></button><button id="preview-collapsed" hidden><span id="collapsed-icon"></span><span id="collapsed-text"></span><span id="collapsed-lang"></span></button><button id="collapse-preview" class="icon" aria-expanded="true"></button></section>
 <section id="settings-panel" class="popover settings-pop" hidden><label>样本字号 <input type="range" id="size" min="20" max="52"><output id="size-label"></output></label><label><input type="checkbox" id="auto-launch"> 自动启动 Affinity 并等待连接</label><button id="focus-affinity">重试连接</button><button id="export">导出收藏与分组</button><label class="file-button">导入 JSON<input id="import" type="file" accept=".json,application/json"></label></section>
 <div class="list-meta"><span id="count">读取本机字体…</span></div>
 <div id="group-menu" class="popover" hidden role="dialog" aria-label="加入分组"></div>
 <div id="font-list" role="listbox" aria-label="字体列表" aria-multiselectable="true" tabindex="0"><div id="spacer"></div><div id="rows"></div><div id="empty" hidden><h2></h2><p></p></div></div>
 <footer><div class="footer-actions"><button id="close">关闭</button><button id="apply" class="primary" disabled>应用字体</button></div></footer>
 <div id="message" role="status" hidden><span id="message-icon"></span><span id="message-text"></span></div>
</main><script type="module" src="/app.js"></script></body></html>
