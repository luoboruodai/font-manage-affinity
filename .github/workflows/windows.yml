name: windows

on:
  push:
    branches: [main]
    tags: ['v0.4.*-alpha']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows engine and shell
        run: |
          dotnet publish native/win/FontEngine -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o native/win/publish/engine
          dotnet publish native/win/FontShell -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o native/win/publish/shell
      - name: Assemble dist/win
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/win | Out-Null
          Copy-Item native/win/publish/engine/* dist/win/
          Copy-Item native/win/publish/shell/* dist/win/
      - name: Font engine smoke (real Windows fonts)
        shell: pwsh
        run: |
          $fontsOut = '{"seq":1,"op":"fonts"}' | & dist/win/font-engine.exe | ConvertFrom-Json
          if ($fontsOut.count -lt 50) { throw "too few fonts: $($fontsOut.count)" }
          $arial = $fontsOut.fonts | Where-Object { $_.id -eq 'ArialMT' }
          if (-not $arial) { throw 'ArialMT not found' }
          if (-not $arial.coverage.latin.supported) { throw 'ArialMT latin not supported' }
          if ($arial.coverage.'zh-Hans'.supported) { throw 'ArialMT must not support zh-Hans' }
          $yahei = $fontsOut.fonts | Where-Object { $_.family -like '*YaHei*' } | Select-Object -First 1
          if (-not $yahei) { throw 'Microsoft YaHei not found' }
          if (-not $yahei.coverage.'zh-Hans'.supported) { throw 'YaHei zh-Hans not supported' }
          if (-not $yahei.coverage.'zh-Hant'.supported) { throw 'YaHei zh-Hant not supported' }
          $previewRaw = '{"seq":2,"op":"preview","id":"ArialMT","text":"Test 123","size":28,"width":360,"scale":2,"mode":"wrap"}' | & dist/win/font-engine.exe
          $previewOut = $previewRaw | ConvertFrom-Json
          if (-not $previewOut.png) { throw "no preview png: $previewRaw" }
          $bytes = [Convert]::FromBase64String($previewOut.png)
          if ($bytes.Length -lt 100 -or $bytes[0] -ne 0x89 -or $bytes[1] -ne 0x50) { throw 'invalid PNG' }
          $cjk = '{"seq":3,"op":"preview","id":"MicrosoftYaHei","text":"简体中文之美","size":28,"width":360,"scale":2,"mode":"wrap"}' | & dist/win/font-engine.exe | ConvertFrom-Json
          if ($cjk.missing.Count -gt 0) { throw "unexpected missing glyphs: $($cjk.missing -join ',')" }
          Write-Host "engine smoke OK: $($fontsOut.count) fonts"
      - name: Node unit tests
        run: |
          npm ci
          npm test
      - name: Verify the double-click installer
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'installer-test'
          New-Item -ItemType Directory -Force "$stage" | Out-Null
          New-Item -ItemType Directory -Force "$stage/dist" | Out-Null
          Copy-Item dist/win "$stage/dist/win" -Recurse
          foreach ($d in 'server','web','config','scripts','src') { Copy-Item $d "$stage/$d" -Recurse }
          Copy-Item package.json "$stage/"
          Copy-Item scripts/install-windows.bat "$stage/install-windows.bat"
          $env:CI = 'true'
          & "$stage/install-windows.bat"
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          Write-Host '--- stage/dist/win ---'; Get-ChildItem "$stage/dist/win" | Select-Object -First 8 Name
          Write-Host '--- DEST ---'; Get-ChildItem "$env:LOCALAPPDATA/Font Manage" -ErrorAction SilentlyContinue | Select-Object -First 12 Name
          if (-not (Test-Path "$env:LOCALAPPDATA/Font Manage/font-workspace.exe")) { throw 'engine not installed' }
          if (-not (Test-Path "$env:USERPROFILE/Desktop/Font Manage.lnk")) { throw 'shortcut missing' }
          if (-not (Test-Path "$env:LOCALAPPDATA/Font Manage/Font Manage.cmd")) { throw 'launcher missing' }
          Write-Host 'installer smoke OK'
      - name: Package Windows preview bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dist/win,server,web,config,scripts,src,package.json,README.md,LICENSE -DestinationPath Font-Manage-0.4.1-windows-alpha.zip -Force
          Compress-Archive -Path scripts/install-windows.bat -DestinationPath Font-Manage-0.4.1-windows-alpha.zip -Update
      - uses: actions/upload-artifact@v4
        with:
          name: Font-Manage-0.4.1-windows-alpha
          path: Font-Manage-0.4.1-windows-alpha.zip
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} Font-Manage-0.4.1-windows-alpha.zip --prerelease --title "Font Manage ${{ github.ref_name }} (Windows preview)" --notes-file release-notes-windows.md || gh release upload ${{ github.ref_name }} Font-Manage-0.4.1-windows-alpha.zip --clobber
